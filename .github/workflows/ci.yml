name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/gui/package-lock.json
      - name: Linux WebKit and tray prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: apps/gui
      - run: npm run check
        working-directory: apps/gui
      - run: npm run build
        working-directory: apps/gui
      - name: Windows ACL regression checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-permissions.ps1
      - name: Windows task lifecycle checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-lifecycle.ps1
      - name: Linux package lifecycle checks
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s packaging/tests -v
      - run: cargo fmt --all --check
      - name: macOS installer regression checks
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s packaging/macos/tests -v
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Optimized glib security regression
        if: runner.os == 'Linux'
        run: cargo test -p batterybridge-gui --all-features --release --locked glib_variant_strings_backport
      - name: Native Windows installer preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-preinstall.ps1
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --all-features --locked
